# Cross-platform export derived from the local `myoccwlenv` Conda environment.
# Windows-only packages, build strings, mirror URLs, and the local prefix were removed.
name: myoccwlenv
channels:
  - conda-forge
  - pytorch
  - dglteam
  - lambouj
  - defaults
dependencies:
  - python=3.7
  - pip
  - numpy=1.21
  - scipy=1.7
  - pandas=1.3
  - matplotlib=3.5
  - pyyaml=6.0
  - h5py
  - networkx=2.7
  - tqdm=4.64
  - requests=2.32
  - notebook=6.5
  - jupyterlab=3.6
  - occt=7.5.1
  - pythonocc-core=7.5.1
  - occwl=3.0.0
  - dgl=2.0.0
  - pytorch=1.13.1
  - torchvision=0.14.1
  - torchaudio=0.13.1
  - pip:
      - aiohttp==3.8.6
      - aiosignal==1.3.1
      - antlr4-python3-runtime==4.9.3
      - async-timeout==4.0.3
      - asynctest==0.13.0
      - bitarray==3.8.0
      - cython==3.0.12
      - fairseq==0.12.2
      - frozenlist==1.3.3
      - fsspec==2023.1.0
      - hydra-core==1.3.2
      - lightning-utilities==0.10.1
      - llvmlite==0.39.1
      - lxml==5.4.0
      - multidict==6.0.5
      - numba==0.56.4
      - omegaconf==2.3.0
      - portalocker==2.7.0
      - protobuf==4.24.4
      - pytorch-lightning==1.8.6
      - regex==2024.4.16
      - sacrebleu==2.4.2
      - tabulate==0.9.0
      - tensorboardx==2.6.2.2
      - torch-cluster==1.6.1
      - torch-geometric==2.2.0
      - torch-scatter==2.1.1
      - torch-sparse==0.6.17
      - torch-spline-conv==1.2.2
      - torchmetrics==0.11.4
      - yarl==1.9.4
